#++
#   DESCRIPTION: The build and the self-contained tests of the gateway on every push (amd64, arm64)
#
#   AUTHOR: Ruslan R. Laishev (BMF, The BadAss SysMan)
#
#   CREATION DATE: 10-NOV-2026
#
#       A push, a pull request or a manual run (Actions -> ci -> Run workflow) builds StarLet and the
#       gateway (Release, as the packages of release.yml) on x86_64 and aarch64 and runs the tests
#       that need no hardware: tests/issues_test.py all (the field reports over a pty pair and a fake
#       RTU slave) and tests/ctl_test.py (the control channel and mbus-ctl). StarLet goes to a prefix
#       in the runner's temporary directory, not to /usr/local. The README badge shows this workflow.
#
#       MODIFICATION HISTORY:
#
#       10-NOV-2026     CLD     Initial revision.
#       22-NOV-2026     CLD     V.01-03: yaLIBCFG (the settings file) instead of libconfig - built from its
#                               release tag like StarLet, into the runner's temporary directory.
#       22-NOV-2026     CLD     V.01-03ECO01: yaLIBCFG X.01-03ECO01 (a number with a leading zero is octal).
#       23-NOV-2026     CLD     V.01-04: yaLIBCFG X.01-04 (CFG$M_FALLBACK: a bad value of a setting with a default is a warning).
#       23-NOV-2026     CLD     V.01-04ECO02: the .deb maintainer scripts are checked by tests/package_scripts_test.sh only.
#--

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STARLET_REPO: "https://gitlab.com/SysMan-One/utility_routines.git"
  YALIBCFG_REPO: "https://github.com/SysMan-One/yaLIBCFG.git"
  YALIBCFG_TAG: "X.01-04"

jobs:
  build-test:
    name: build and test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake \
            git ca-certificates python3

      - uses: actions/checkout@v5

      - name: Build StarLet
        run: |
          git clone --depth 1 "$STARLET_REPO" "$RUNNER_TEMP/starlet-src"
          git -C "$RUNNER_TEMP/starlet-src" log -1 --format='StarLet: %H %cd'
          cmake -S "$RUNNER_TEMP/starlet-src" -B "$RUNNER_TEMP/starlet-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/starlet"
          cmake --build "$RUNNER_TEMP/starlet-build" -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/starlet-build"

      - name: Build yaLIBCFG
        run: |
          git clone --depth 1 --branch "$YALIBCFG_TAG" "$YALIBCFG_REPO" "$RUNNER_TEMP/yalibcfg-src"
          git -C "$RUNNER_TEMP/yalibcfg-src" log -1 --format='yaLIBCFG: %H %cd'
          cmake -S "$RUNNER_TEMP/yalibcfg-src" -B "$RUNNER_TEMP/yalibcfg-build" -DCMAKE_BUILD_TYPE=Release \
            -DYALIBCFG_M_HELPLIB=OFF -DYALIBCFG_M_EXAMPLES=OFF -DYALIBCFG_M_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/starlet" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/yalibcfg"
          cmake --build "$RUNNER_TEMP/yalibcfg-build" -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/yalibcfg-build"

      - name: Build the gateway
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/starlet;$RUNNER_TEMP/yalibcfg"
          cmake --build build -j "$(nproc)"
          file build/mbusgw-t2r build/mbus-ctl
          out=$(build/mbusgw-t2r 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'REVISNF'
          build/mbus-ctl help | grep -q 'RESTART GATEWAY'

      - name: Test the field reports (tests/issues_test.py)
        run: python3 tests/issues_test.py --gw build/mbusgw-t2r all

      - name: Test the control channel (tests/ctl_test.py)
        run: python3 tests/ctl_test.py --gw build/mbusgw-t2r --ctl build/mbus-ctl

      - name: Test package service scripts (tests/package_scripts_test.sh)
        run: |
          docker run --rm -v "$PWD:/src:ro" alpine:3.21 \
            sh -ec 'mkdir -p /run/systemd/system; sh /src/tests/package_scripts_test.sh /src'

      - name: Check manual installation and uninstall
        run: |
          export DESTDIR="$RUNNER_TEMP/mbusgw-stage"
          cmake --install build
          test -x "$DESTDIR/usr/local/sbin/mbusgw-t2r"
          conf="$DESTDIR/usr/local/etc/mbusgw-t2r/modbus-t2r_settings.conf"
          echo '# tuned by hand' >> "$conf"
          cmake --install build
          cmake --build build --target uninstall
          grep -q '^# tuned by hand' "$conf"
          test ! -e "$DESTDIR/usr/local/sbin/mbusgw-t2r"
          if (cd build && cpack -G DEB); then
            echo 'Packaging a manual installation must fail'
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: logs-${{ matrix.arch }}
          path: |
            /tmp/t2r_issues_*/
            /tmp/t2r_ctl_*/
          if-no-files-found: ignore
