#++
#   DESCRIPTION: The .deb packages of the gateway (amd64, arm64) for a GitHub Release
#
#   AUTHOR: Ruslan R. Laishev (BMF, The BadAss SysMan)
#
#   CREATION DATE: 28-OCT-2026
#
#	A push of the tag that is the __IDENT__ of src/t2r_main.c (V.01-01ECO02, X.01-02; the package
#	version follows __REV__: V.01-01ECO02 -> 1.1.2) builds the packages and attaches them, the User
#	Guide PDFs and the sources tarball to the Release of that tag; the older tags v<VERSION> (v0.13.5)
#	and V<MM>.<NN>.<E> (V01.01.0) are still taken. The manual run (Actions -> release -> Run
#	workflow) with the <tag> input does the same for an existing tag (the files of its Release are
#	replaced); without it - only builds and tests the packages of the branch, see the run's artifacts.
#
#	The packages are built on Debian 12 (bookworm): the binary needs glibc >= 2.34 only (bookworm,
#	trixie, Ubuntu 22.04 and newer); libconfig and StarLet are linked statically.
#	Every package is installed and started on bookworm, trixie and noble before the release.
#
#	The .deb for mipsel and mips64el is a cross build on bookworm (Debian 13 has no MIPS); it is
#	started under qemu-user (no MIPS image of Debian to install it into). The OpenWrt packages
#	are built by the official SDK containers from the feed openwrt/: .ipk by 24.10, .apk by 25.12;
#	those of x86_64 and mips_24kc are installed and started in the OpenWrt rootfs images.
#
#	MODIFICATION HISTORY:
#
#	28-OCT-2026	RRL	The User Guide PDFs are attached to the Release too (named as before:
#				mbusgw-t2r-<IDENT>-UserGuide_EN.pdf); the manual run takes a <tag>.
#
#	28-OCT-2026	RRL	The sources tarball mbusgw-t2r-<IDENT>.tar.gz (git archive of the tag,
#				the top directory mbusgw-t2r-<IDENT>/) is attached to the Release too.
#
#	28-OCT-2026	RRL	The actions run on Node.js 24 (Node.js 20 is deprecated): checkout@v5,
#				upload-artifact@v6, download-artifact@v7.
#
#	28-OCT-2026	RRL	X.00-13ECO06: the .deb for mipsel and mips64el (cross), the OpenWrt
#				.ipk/.apk for mips_24kc, mipsel_24kc, aarch64_cortex-a53, arm_cortex-a7,
#				arm_cortex-a7_neon-vfpv4 and x86_64.
#
#	29-OCT-2026	RRL	The OpenWrt build with V=sc: with V=s the SDK runs make of CMake with no
#				VERBOSE=1, the compile lines (-DHAVE_TIOCRS485) are not in the logs.
#
#	04-NOV-2026	CLD	V.01-00: the tag may be V<MM>.<NN>.<E> too (V01.00.0 -> the package version 1.0.0):
#				V is a product version, X (v<VERSION>) is a field test one; the leading zeros of
#				the fields are dropped for the package version and the Release title.
#
#	06-NOV-2026	CLD	V.01-01: the installed packages (.deb, .ipk/.apk) must carry a working mbus-ctl.
#
#	10-NOV-2026	CLD	SHA256SUMS is signed with minisign (the MINISIGN_KEY secret, checked with
#				minisign.pub of the tag), SHA256SUMS.minisig is attached to the Release.
#
#	11-NOV-2026	CLD	The signature is checked with the public key written in the workflow,
#				not minisign.pub of the tag: a re-run of an older tag has no such file.
#
#	12-NOV-2026	CLD	The tag may be the IDENT itself (X.aa-bb[ECOcc], V.aa-bb[ECOcc]): it must be
#				the __IDENT__ of src/t2r_main.c, the package version is aa.bb.cc without the
#				leading zeros (V.01-01ECO02 -> 1.1.2, V.01-01 -> 1.1.0) and must be the one of
#				__REV__; the X.* tags start the run too. v<VERSION> and V<MM>.<NN>.<E> as before.
#--

name: release

on:
  push:
    tags: ['v*', 'V*', 'X.*']             # V* takes V.aa-bb[ECOcc] and the older V<MM>.<NN>.<E>
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag (V.01-01ECO02; the older v0.13.5, V01.01.0) to build and release; empty - build only"
        required: false
        default: ""

permissions:
  contents: write

env:
  STARLET_REPO: "https://gitlab.com/SysMan-One/utility_routines.git"

jobs:
  deb:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential cmake pkg-config \
            libconfig-dev dpkg-dev file git ca-certificates

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build and install StarLet
        run: |
          git clone --depth 1 "$STARLET_REPO" /tmp/starlet
          git -C /tmp/starlet log -1 --format='StarLet: %H %cd'
          cmake -S /tmp/starlet -B /tmp/starlet/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/starlet/build -j "$(nproc)"
          cmake --install /tmp/starlet/build

      - name: Build the gateway and the package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DT2R_SYSTEMD_UNIT=ON
          cmake --build build -j "$(nproc)"
          cd build && cpack -G DEB

      - name: Check the package
        run: |
          deb=$(ls build/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          case "$deb" in *_${{ matrix.arch }}.deb) ;; *) echo "Wrong architecture: $deb"; exit 1;; esac
          file build/mbusgw-t2r
          readelf -d build/mbusgw-t2r | grep NEEDED
          if readelf -d build/mbusgw-t2r | grep -q 'libconfig'; then
            echo "libconfig is linked dynamically"; exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  test:
    name: test ${{ matrix.arch }} on ${{ matrix.distro }}
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: ['debian:bookworm', 'debian:trixie', 'ubuntu:noble']
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deb-${{ matrix.arch }}

      - name: Install, upgrade-in-place and start the gateway
        run: |
          apt-get update
          apt-get install --yes ./*.deb
          apt-get install --yes --reinstall ./*.deb
          test -f /usr/lib/systemd/system/mbusgw-t2r.service
          test -f /opt/mbusgw-t2r/etc/modbus-t2r_settings.conf
          if ldd /opt/mbusgw-t2r/sbin/mbusgw-t2r | grep 'not found'; then exit 1; fi
          out=$(/opt/mbusgw-t2r/sbin/mbusgw-t2r 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'REVISNF'
          /opt/mbusgw-t2r/sbin/mbus-ctl help | grep -q 'RESTART GATEWAY'
          apt-get remove --yes mbusgw-t2r

  deb-cross:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: mipsel,   triplet: mipsel-linux-gnu,         qemu: qemu-mipsel }
          - { arch: mips64el, triplet: mips64el-linux-gnuabi64,  qemu: qemu-mips64el }
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      ARCH: ${{ matrix.arch }}
      TRIPLET: ${{ matrix.triplet }}
    steps:
      - name: Install prerequisites
        run: |
          dpkg --add-architecture "$ARCH"
          apt-get update
          apt-get install --yes --no-install-recommends build-essential cmake pkg-config \
            dpkg-dev file git ca-certificates crossbuild-essential-$ARCH libconfig-dev:$ARCH qemu-user

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build and install StarLet
        run: |
          git clone --depth 1 "$STARLET_REPO" /tmp/starlet
          git -C /tmp/starlet log -1 --format='StarLet: %H %cd'
          cmake -S /tmp/starlet -B /tmp/starlet/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$ARCH" -DCMAKE_C_COMPILER="$TRIPLET-gcc" \
            -DCMAKE_INSTALL_PREFIX=/opt/cross
          cmake --build /tmp/starlet/build -j "$(nproc)"
          cmake --install /tmp/starlet/build

      - name: Build the gateway and the package
        run: |
          export PKG_CONFIG_LIBDIR="/usr/lib/$TRIPLET/pkgconfig:/usr/share/pkgconfig"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DT2R_SYSTEMD_UNIT=ON \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$ARCH" -DCMAKE_C_COMPILER="$TRIPLET-gcc" \
            -DCMAKE_PREFIX_PATH=/opt/cross -DT2R_DEB_ARCH="$ARCH"
          grep -q '^HAVE_TIOCRS485:INTERNAL=1' build/CMakeCache.txt || { echo 'No RS-485 (TIOCSRS485)'; exit 1; }
          cmake --build build -j "$(nproc)"
          cd build && cpack -G DEB

      - name: Check the package
        run: |
          deb=$(ls build/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          case "$deb" in *_${ARCH}.deb) ;; *) echo "Wrong architecture: $deb"; exit 1;; esac
          file build/mbusgw-t2r
          readelf -d build/mbusgw-t2r | grep NEEDED
          if readelf -d build/mbusgw-t2r | grep -q 'libconfig'; then
            echo "libconfig is linked dynamically"; exit 1
          fi
          out=$(${{ matrix.qemu }} -L / build/mbusgw-t2r 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'REVISNF'

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  openwrt:
    name: openwrt ${{ matrix.arch }} ${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        arch: [mips_24kc, mipsel_24kc, aarch64_cortex-a53, arm_cortex-a7, arm_cortex-a7_neon-vfpv4, x86_64]
        release: ['24.10', '25.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build by the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.release }}
          FEEDNAME: mbusgw
          PACKAGES: mbusgw-t2r
          V: sc                               # 'c': VERBOSE=1 of CMake, the compile lines are in logs/

      - name: Check the package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir out
          ls -l bin/packages/$ARCH/mbusgw/
          for f in bin/packages/$ARCH/mbusgw/mbusgw-t2r*; do
            case "$f" in
              *.ipk)                            # tar.gz: debian-binary, control.tar.gz, data.tar.gz
                cp "$f" out/
                mkdir ipk && tar -xzf "$f" -C ipk && tar -xzf ipk/data.tar.gz -C ipk
                tar -xzOf ipk/control.tar.gz ./control
                find ipk -type f | sort
                file ipk/usr/sbin/mbusgw-t2r
                readelf -d ipk/usr/sbin/mbusgw-t2r | grep NEEDED
                if readelf -d ipk/usr/sbin/mbusgw-t2r | grep -q 'libconfig'; then
                  echo "libconfig is linked dynamically"; exit 1
                fi ;;
              *.apk)                            # mbusgw-t2r-0.13.6-r1.apk -> mbusgw-t2r_0.13.6-r1_<arch>.apk
                v=${f##*/mbusgw-t2r-}; v=${v%.apk}
                cp "$f" "out/mbusgw-t2r_${v}_${ARCH}.apk" ;;
            esac
          done
          ls -l out
          test -n "$(ls out)"
          grep -rq -- '-DHAVE_TIOCRS485' logs/ || { echo 'No RS-485 (TIOCSRS485)'; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: owrt-${{ matrix.arch }}-${{ matrix.release }}
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-openwrt-${{ matrix.arch }}-${{ matrix.release }}
          path: logs/
          if-no-files-found: ignore

  openwrt-test:
    name: test openwrt ${{ matrix.arch }} ${{ matrix.release }}
    needs: openwrt
    strategy:
      fail-fast: false
      matrix:
        arch: [mips_24kc, x86_64]
        release: ['24.10', '25.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: owrt-${{ matrix.arch }}-${{ matrix.release }}
          path: pkg

      - name: qemu-user for MIPS
        if: matrix.arch == 'mips_24kc'
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-static
          ls /proc/sys/fs/binfmt_misc/ | grep qemu-mips

      - name: Install, start and remove the gateway
        run: |
          cat > pkg/test.sh <<'EOF'
          set -ex
          mkdir -p /var/lock /var/run
          if ls /pkg/*.ipk > /dev/null 2>&1; then           # No feed update: no dependencies
            opkg install /pkg/*.ipk
            opkg install --force-reinstall /pkg/*.ipk
          else
            apk add --allow-untrusted /pkg/*.apk
          fi
          test -x /usr/sbin/mbusgw-t2r
          test -x /etc/init.d/mbusgw-t2r
          test -f /etc/config/mbusgw-t2r
          test -f /etc/mbusgw-t2r/modbus-t2r_settings.conf
          out=$(/usr/sbin/mbusgw-t2r 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'REVISNF'
          test -x /usr/sbin/mbus-ctl
          /usr/sbin/mbus-ctl help | grep -q 'RESTART GATEWAY'
          if ls /pkg/*.ipk > /dev/null 2>&1; then opkg remove mbusgw-t2r; else apk del mbusgw-t2r; fi
          EOF
          docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD/pkg:/pkg" openwrt/rootfs:${{ matrix.arch }}-openwrt-${{ matrix.release }} /bin/sh /pkg/test.sh

  release:
    name: GitHub Release
    needs: [test, deb-cross, openwrt-test]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || startsWith(github.ref, 'refs/tags/X.') || startsWith(inputs.tag, 'v') || startsWith(inputs.tag, 'V') || startsWith(inputs.tag, 'X.')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src

      - uses: actions/download-artifact@v7
        with:
          pattern: '{deb,owrt}-*'
          merge-multiple: true

      - name: Collect the files and SHA256SUMS
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ident=$(sed -n 's/^#define[[:space:]]*__IDENT__[[:space:]]*"\(.*\)"/\1/p' src/src/t2r_main.c)
          test -n "$ident"
          # The tag is the IDENT (X.aa-bb[ECOcc] or V.aa-bb[ECOcc]): it must be the __IDENT__ of the tree,
          # the package version is aa.bb.cc without the leading zeros (V.01-01ECO02 -> 1.1.2, V.01-01 -> 1.1.0)
          # and must be the one CMake takes from __REV__. The older tags v<VERSION> (the field test, v0.13.5)
          # and V<MM>.<NN>.<E> (the product, V01.01.0): the tag without the prefix and the leading zeros.
          # The ECO of the form X./V. is two digits, no more and no less: V.01-01ECO2 is refused.
          re='^[XV]\.([0-9][0-9])-([0-9][0-9])(ECO([0-9][0-9]))?$'
          if [[ "$TAG" =~ $re ]]; then
            test "$TAG" = "$ident" || { echo "::error::the tag $TAG is not the __IDENT__ $ident of src/t2r_main.c"; exit 1; }
            VER=$((10#${BASH_REMATCH[1]})).$((10#${BASH_REMATCH[2]})).$((10#${BASH_REMATCH[4]:-0}))
            rev=$(sed -n 's/^#define[[:space:]]*__REV__[[:space:]]*"\([0-9.]*\)".*/\1/p' src/src/t2r_main.c)
            rver=$(echo "$rev" | sed -E 's/(^|\.)0+([0-9])/\1\2/g')
            test "$VER" = "$rver" || { echo "::error::the tag $TAG (version $VER) is not __REV__ $rev ($rver) of src/t2r_main.c"; exit 1; }
          elif [[ "$TAG" == [XV].* ]]; then
            echo "::error::the tag $TAG is not of the form X.aa-bb[ECOcc] or V.aa-bb[ECOcc] (two digits each)"; exit 1
          else
            VER=$(echo "${TAG#[vV]}" | sed -E 's/(^|\.)0+([0-9])/\1\2/g')
          fi
          for l in EN RU; do
            cp "src/docs/UserGuide_$l.pdf" "mbusgw-t2r-$ident-UserGuide_$l.pdf"
          done
          git -C src archive --format=tar.gz --prefix="mbusgw-t2r-$ident/" \
            -o "$PWD/mbusgw-t2r-$ident.tar.gz" HEAD
          ls -l *.deb *.ipk *.apk *.pdf *.tar.gz
          for pkg in *.deb *.ipk *.apk; do      # The tag must be the package version
            case "$pkg" in mbusgw-t2r_${VER}-*) ;; *) echo "$pkg does not match $TAG"; exit 1;; esac
          done
          sha256sum *.deb *.ipk *.apk *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          echo "VER=$VER" >> "$GITHUB_ENV"

      # One minisign signature over SHA256SUMS vouches for every file of the
      # release.  The secret key is the MINISIGN_KEY secret of this repository
      # (no password); it lives in the runner's temporary directory for this
      # step only.  The signature is checked with the public key written below
      # (the one of minisign.pub; an older tag has no minisign.pub) before
      # anything is published.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "${MINISIGN_KEY}" ]
          then
            echo "::error::no MINISIGN_KEY secret - the release would go out unsigned"
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          key="${RUNNER_TEMP}/minisign.key"
          trap 'rm -f "${key}"' EXIT
          ( umask 077; printf '%s\n' "${MINISIGN_KEY}" > "${key}" )
          minisign -S -s "${key}" -m SHA256SUMS \
            -t "mbusgw-t2r ${TAG} SHA256SUMS signed $(date -u +%d-%b-%Y | tr a-z A-Z)"
          # The key is pinned here, not read from src/: a re-run of an older tag has no minisign.pub.
          minisign -Vm SHA256SUMS -P RWQl4NAqFsHKkNoHkS52WSZSk+2kb+e58DWYpoi/jVFa6TqOTAm3Ph14

      - name: Attach the packages to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" *.deb *.ipk *.apk *.pdf *.tar.gz SHA256SUMS SHA256SUMS.minisig --clobber
          else
            gh release create "$TAG" *.deb *.ipk *.apk *.pdf *.tar.gz SHA256SUMS SHA256SUMS.minisig --title "mbusgw-t2r ${VER}" --notes-file - <<EOF
          The .deb for amd64 and arm64 is tested on Debian 12, Debian 13 and Ubuntu 24.04 (any system with glibc >= 2.34 should do); for mipsel and mips64el it is built for Debian 12. The service is installed disabled: \`sudo systemctl enable --now mbusgw-t2r\`. Install: \`sudo apt install ./mbusgw-t2r_${VER}-1_<arch>.deb\`.

          OpenWrt: the .ipk is for 24.10 (\`opkg install ./mbusgw-t2r_${VER}-*_<arch>.ipk\`), the .apk is for 25.12 (\`apk add --allow-untrusted ./mbusgw-t2r_${VER}-*_<arch>.apk\`); libconfig and StarLet are linked statically, no network is needed for the install. The service is installed disabled: \`uci set mbusgw-t2r.main.enabled=1 && uci commit mbusgw-t2r && /etc/init.d/mbusgw-t2r start\`.

          To check a download: \`minisign -Vm SHA256SUMS -P RWQl4NAqFsHKkNoHkS52WSZSk+2kb+e58DWYpoi/jVFa6TqOTAm3Ph14\` (\`SHA256SUMS.minisig\` next to it), then \`sha256sum -c --ignore-missing SHA256SUMS\`.
          EOF
          fi
